name: backtest-prices
on:
  push:
    branches: [claude/backtest-prices]
    paths: ["backtest-data/**", ".github/workflows/backtest-prices.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install yfinance pandas
      - run: python backtest-data/fetch.py
      - name: Commit data to this branch
        run: |
          mkdir -p backtest-data/out && mv nse_prices_backtest.csv.gz prior_ath.csv failed.txt backtest-data/out/
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add backtest-data/out && git commit -m "Price data for setup backtest" && git push
      - uses: actions/upload-artifact@v4
        with:
          name: nse-prices
          path: |
            backtest-data/out/
          retention-days: 7
